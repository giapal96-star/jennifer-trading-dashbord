name: Jennifer Trading System

on:
  schedule:
    - cron: '0,30 8-22 * * 1-5'
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: mkdir -p docs data
      - run: ls -la
      - name: Esegui Layer 1
        env:
          GITHUB_ACTIONS: "true"
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python "Sarada_Trading_System.py" --single-run
      - name: Pubblica dashboard
        run: |
          git config user.email "jennifer-bot@trading.com"
          git config user.name "Jennifer Bot"
          git add docs/ -f
          git diff --staged --quiet || git commit -m "📊 Dashboard aggiornata $(date +'%d/%m/%Y %H:%M')"
          git push
